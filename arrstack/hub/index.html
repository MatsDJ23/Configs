<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARR-Stack Hub</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #22262f;
    --text: #e7e9ee;
    --muted: #8b90a0;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 28px 0;
    text-align: center;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(4, 1fr));
    gap: 16px;
  }
  a.card {
    display: block;
    background: var(--card);
    border-radius: 14px;
    padding: 24px 20px;
    text-decoration: none;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.06);
    transition: background 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    background: var(--card-hover);
    transform: translateY(-2px);
  }
  .name {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .desc {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>ARR-Stack</h1>
    <div class="grid">
      <a class="card" href="http://192.168.2.50:9696/" target="_blank">
        <div class="name"><span class="dot"></span>Prowlarr</div>
        <div class="desc">Index management</div>
      </a>
      <a class="card" href="http://192.168.2.50:8989/" target="_blank">
        <div class="name"><span class="dot"></span>Sonarr</div>
        <div class="desc">TV show management</div>
      </a>
      <a class="card" href="http://192.168.2.50:7878/" target="_blank">
        <div class="name"><span class="dot"></span>Radarr</div>
        <div class="desc">Movie management</div>
      </a>
      <a class="card" href="http://192.168.2.50:8686/" target="_blank">
        <div class="name"><span class="dot"></span>Lidarr</div>
        <div class="desc">Music management</div>
      </a>
      <a class="card" href="http://192.168.2.50:6767/" target="_blank">
        <div class="name"><span class="dot"></span>Bazzarr</div>
        <div class="desc">Subtitle Management</div>
      </a>
      <a class="card" href="http://192.168.2.50:8080/" target="_blank">
        <div class="name"><span class="dot"></span>qBittorrent</div>
        <div class="desc">Download client torrent</div>
      </a>
    </div>
  </div>
</body>
</html>
